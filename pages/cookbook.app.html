<style>
#cookbook-app{
  --cb-relay-soft:#efeafd; --cb-signal-soft:#fbe7dd;
  --cb-kw:#8E3BD6; --cb-str:#1B7A44; --cb-com:#837C9C; --cb-num:#B93B06; --cb-fn:#2160C4;
  display:block; margin:22px 0 4px; font-family:var(--text);
}
@media (prefers-color-scheme:dark){#cookbook-app{
  --cb-relay-soft:#1e1836; --cb-signal-soft:#2a160c;
  --cb-kw:#C9A7FF; --cb-str:#5BD79B; --cb-com:#7D769B; --cb-num:#FFA36B; --cb-fn:#7FB0FF;
}}

#cookbook-app .cb-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
#cookbook-app .cb-link{display:inline-flex;gap:8px;align-items:baseline;padding:7px 13px;
  border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--panel);
  font-family:var(--text);color:var(--dim);font-size:13.5px;line-height:1.2}
#cookbook-app .cb-link:hover{color:var(--ink);border-color:var(--faint)}
#cookbook-app .cb-link.on{color:var(--ink);background:var(--bg);border-color:var(--accent-mark);font-weight:600}
#cookbook-app .cb-link .cb-n{font-family:var(--mono);font-size:12px;color:var(--relay);font-weight:700}
#cookbook-app .cb-link.on .cb-n{color:var(--accent-mark)}

#cookbook-app .cb-body{min-width:0}
#cookbook-app .cb-exhead{margin-bottom:16px}
#cookbook-app .cb-tag{font-family:var(--mono);font-size:12px;color:var(--relay)}
#cookbook-app .cb-exhead h3{font-family:var(--display);font-weight:700;font-size:22px;
  letter-spacing:-.01em;margin:5px 0 8px}
#cookbook-app .cb-exhead p{margin:0;color:var(--dim);font-size:15px;line-height:1.55}
#cookbook-app .cb-needs{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
#cookbook-app .cb-need{font-family:var(--mono);font-size:11px;color:var(--dim);
  background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

#cookbook-app .cb-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:13px;
  flex-wrap:wrap;padding:10px 0;margin-bottom:4px;
  background:linear-gradient(var(--bg),var(--bg) 72%,transparent)}
#cookbook-app .cb-seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);
  border-radius:10px;padding:3px}
#cookbook-app .cb-seg button{font-family:var(--mono);font-size:13px;border:0;background:none;
  color:var(--dim);padding:6px 13px;border-radius:7px;cursor:pointer}
#cookbook-app .cb-seg button.on{background:var(--bg);color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(20,19,31,.06)}
#cookbook-app .cb-seg button:disabled{opacity:.35;cursor:not-allowed}
#cookbook-app .cb-hint{font-family:var(--mono);font-size:12px;color:var(--faint)}
#cookbook-app .cb-hint b{color:var(--accent);font-weight:500}

#cookbook-app .cb-phase{border:1px solid var(--line);border-radius:13px;overflow:hidden;
  margin-bottom:13px;background:var(--panel);scroll-margin-top:60px;transition:border-color .15s}
#cookbook-app .cb-phase.lit{border-color:var(--accent-mark)}
#cookbook-app .cb-phh{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer;user-select:none}
#cookbook-app .cb-num{font-family:var(--display);font-weight:700;font-size:14px;color:var(--relay);
  background:var(--cb-relay-soft);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
#cookbook-app .cb-phase.lit .cb-num{color:var(--accent-mark);background:var(--cb-signal-soft)}
#cookbook-app .cb-pht{flex:1;min-width:0}
#cookbook-app .cb-pht b{font-family:var(--display);font-size:15.5px;letter-spacing:-.01em;display:block}
#cookbook-app .cb-pht span{color:var(--dim);font-size:13.5px;line-height:1.5;display:block;margin-top:3px}
#cookbook-app .cb-chev{color:var(--faint);font-family:var(--mono);font-size:12px;flex:none;margin-top:3px;transition:transform .2s}
#cookbook-app .cb-phase.closed .cb-chev{transform:rotate(-90deg)}
#cookbook-app .cb-phase.closed .cb-pbody{display:none}
#cookbook-app .cb-pbody{padding:0 16px 16px}
#cookbook-app .cb-docs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 11px}
#cookbook-app .cb-docs a{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--relay);
  background:var(--cb-relay-soft);border:1px solid transparent;border-radius:7px;padding:3px 9px}
#cookbook-app .cb-docs a:hover{border-color:var(--relay)}
#cookbook-app .cb-docs a::after{content:" \2197";color:var(--faint)}

#cookbook-app pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;
  overflow-x:auto;padding:13px 15px}
#cookbook-app pre code{font-family:var(--mono);font-size:12.7px;line-height:1.65;white-space:pre;color:var(--ink)}
#cookbook-app .cb-kw{color:var(--cb-kw)}
#cookbook-app .cb-str{color:var(--cb-str)}
#cookbook-app .cb-com{color:var(--cb-com);font-style:italic}
#cookbook-app .cb-numt{color:var(--cb-num)}
#cookbook-app .cb-fnt{color:var(--cb-fn)}
#cookbook-app .cb-na{color:var(--faint);font-family:var(--mono);font-size:13px;padding:13px 15px;
  border:1px dashed var(--line);border-radius:10px;background:var(--sunk)}
</style>

<script>
(function(){
const DOCS = "";  // same directory as this page on the site
const D = (page, text) => ({href: DOCS + page, text});
const EXAMPLES = [
{
  id:"blank-setup", n:1, title:"A board on show",
  tag:"Example 1 · needs a display",
  purpose:"A blank setup, one companion set to a LilyGo T-Deck running wadamesh, and its own window left open on the Hardware tab so the board draws its screen.",
  needs:["a display","a wadamesh image to import"],
  phases:[
    { label:"Open the workbench, start a project",
      note:"Launch opens the desktop application and returns a handle to it; the with/defer closes it on the way out. project.new starts an empty scenario centred on a place.",
      docs:[D("scripting.html","Opening a session"), D("getting-started.html","Your first network")],
      code:{
python:`with Workbench.launch() as wb:
    wb.project.new(place="Fife")`,
go:`wb, err := meshbench.Launch(ctx)
if err != nil { log.Fatal(err) }
defer func() { _ = wb.Close() }()

if err := wb.Project().New(ctx, "Fife"); err != nil { log.Fatal(err) }`}},
    { label:"Place a companion, as a T-Deck",
      note:"One node, of kind companion, at a coordinate, on a board. The board is what makes this an emulated T-Deck rather than a host build — it is why there is a screen to show at the end.",
      docs:[D("getting-started.html","Placing nodes"), D("firmware-library.html","Boards")],
      code:{
python:`deck = wb.nodes.place(
    "Deck",
    kind=Kind.COMPANION,
    lat=56.19,
    lon=-3.17,
    board=BOARD,   # Board.LILYGO_TDECK
)`,
go:`deck, err := wb.Nodes().Place(ctx, meshbench.Placement{
    Name: "Deck", Kind: meshbench.Companion,
    Lat: 56.19, Lon: -3.17, Board: board, // BoardLilyGoTDeck
})
if err != nil { log.Fatal(err) }`}},
    { label:"Find the firmware, importing it if absent",
      note:"Look the build up by name against whatever the library holds, rather than pinning a version typed here that goes stale. wadamesh is imported, not downloaded \u2014 it is not in the catalogue \u2014 so if the build is not on this machine yet, import a built image for it: point WADAMESH_IMAGE at one, or import it in the workbench by hand first. Its role is companion_radio_usb, the USB companion a board image carries.",
      docs:[D("firmware-library.html","Firmware library"), D("importing.html","Importing a build")],
      code:{
python:`wb.firmware.scan()
try:
    build = wb.firmware.find(WADAMESH, board=BOARD)
except NotFound:
    # wadamesh is imported, not in the download catalogue.
    if not WADAMESH_IMAGE:
        sys.exit("wadamesh is not in the library; set "
                 "WADAMESH_IMAGE to a built image, or import one first")
    build = wb.firmware.import_(
        WADAMESH_IMAGE, Role.COMPANION_RADIO_USB, board=BOARD, label=WADAMESH)`,
go:`build, err := wb.Firmware().Find(ctx, wadamesh, board)
if errors.Is(err, meshbench.ErrNotFound) {
    // wadamesh is imported, not in the download catalogue.
    image := os.Getenv("WADAMESH_IMAGE")
    if image == "" {
        log.Fatal("wadamesh is not in the library; set WADAMESH_IMAGE to a built image, or import one first")
    }
    build, err = wb.Firmware().Import(ctx, image,
        meshbench.RoleCompanionRadioUSB, board, wadamesh)
}`}},
    { label:"Pin it, start, wait for the board to boot",
      note:"Setting firmware on a node stops it, provisions it and starts it. On a board that means booting an emulator, which is why the wait is generous.",
      docs:[D("scripting.html","Bringing a run up"), D("emulation.html","Emulation")],
      code:{
python:`deck.firmware = build          # stop, provision, start

wb.sim.start()
deck.wait_running(timedelta(minutes=5))`,
go:`if err := deck.SetFirmware(ctx, build, true); err != nil { log.Fatal(err) } // stop, provision, start

if err := wb.Sim().Start(ctx); err != nil { log.Fatal(err) }
if err := deck.WaitRunning(ctx, 5*time.Minute); err != nil { log.Fatal(err) }`}},
    { label:"Open the node's window on Hardware",
      note:"The Hardware tab is where the board draws its own screen — the whole reason for making this node a T-Deck. The window is held open only for someone looking at it: piped or in CI, there is nobody to press enter.",
      docs:[D("app-development.html","Node windows"), D("testing-repeaters.html","Watching a board")],
      code:{
python:`tab = wb.window(deck, tab="Hardware")
print(f"{deck.name} is up on {build}; window open on {tab}")

if sys.stdin.isatty():
    input("press enter to close the workbench ")`,
go:`tab, err := wb.Window(ctx, deck.Name(), meshbench.TabHardware)
if err != nil { log.Fatal(err) }
fmt.Printf("%s is up on %s; window open on %s\\n",
    deck.Name(), build.Describe(), tab)

if st, err := os.Stdin.Stat(); err == nil && st.Mode()&os.ModeCharDevice != 0 {
    _, _ = fmt.Scanln()
}`}}
  ]
},
{
  id:"two-nodes", n:2, title:"A local build on two nodes",
  tag:"Example 2 · re-runnable",
  purpose:"A fixture trimmed to two companions in Scotland, both on a build made from a MeshCore checkout. The second run attaches to the workbench the first one left, rebuilds and repoints — rather than paying for the fixture twice.",
  needs:["a display","a MeshCore checkout"],
  phases:[
    { label:"Attach to the open session, or launch one",
      note:"attach_or_launch is what makes the example re-runnable: the second run reuses the session already up. The very first thing after is to stop the clock — a no-op on a fresh session, and what makes a second run safe on a live one.",
      docs:[D("scripting.html","Two clocks"), D("scripting.html","Re-running")],
      code:{
python:`with Workbench.attach_or_launch() as wb:
    # A launched workbench is never empty - it opens its default
    # fixture - so test the mesh, not "is the session empty".
    already = {n.name for n in wb.nodes.list()} == set(KEEP)

    wb.sim.pause()   # stop the clock before touching anything`,
go:`wb, err := meshbench.AttachOrLaunch(ctx)
if err != nil { log.Fatal(err) }
defer func() { _ = wb.Close() }()

if err := wb.Sim().Pause(ctx); err != nil { log.Fatal(err) } // stop the clock first

nodes, err := wb.Nodes().List(ctx)
if err != nil { log.Fatal(err) }
already := len(nodes) == len(keep)
for _, n := range nodes {
    if _, want := keep[n.Name]; !want { already = false; break }
}`}},
    { label:"First run only: trim the fixture to two",
      note:"Open a shipped fixture, put the two keepers where they belong, then keep() deletes everything else. keep is all-or-none, so a name that is not there yet refuses and removes nothing — which is why the placing happens first.",
      docs:[D("fixtures.html","Shipped networks"), D("getting-started.html","Trimming a network")],
      code:{
python:`if not already:
    wb.project.open("fife-strict")
    for name, (lat, lon) in KEEP.items():
        if name in wb.nodes:
            wb.nodes[name].move(lat, lon)
        else:
            wb.nodes.place(name, Kind.COMPANION, lat, lon)
    wb.nodes.keep(*KEEP)
    wb.wait_idle(timedelta(minutes=10))`,
go:`if !already {
    if err := wb.Project().Open(ctx, "fife-strict"); err != nil { log.Fatal(err) }
    have, err := wb.Nodes().List(ctx)
    if err != nil { log.Fatal(err) }
    for _, name := range want { // sorted keys of keep
        at := keep[name]
        if containsName(have, name) {
            if err := wb.Node(name).Move(ctx, at[0], at[1]); err != nil { log.Fatal(err) }
            continue
        }
        _, err := wb.Nodes().Place(ctx, meshbench.Placement{
            Name: name, Kind: meshbench.Companion, Lat: at[0], Lon: at[1]})
        if err != nil { log.Fatal(err) }
    }
    if err := wb.Nodes().Keep(ctx, want...); err != nil { log.Fatal(err) }
    if err := wb.WaitIdle(ctx, 10*time.Minute); err != nil { log.Fatal(err) }
}`}},
    { label:"Build both roles from the checkout",
      note:"Both roles come out of one build invocation, deliberately: two arms built at different moments measure the build process, not the firmware. A repeater built against a stale shim once spoke a different console protocol and looked broken.",
      docs:[D("firmware-development.html","Building a checkout"), D("firmware-integration.html","The radio shim")],
      code:{
python:`# meshbench dev -from <checkout> -role <role> -name <name>,
# once per role, then look each build up by the name you chose.
builds = build_from_checkout(checkout, wb)`,
go:`// Both roles in one call; the client waits for the build.
built, err := wb.Firmware().BuildAndWait(ctx, checkout, 30*time.Minute)
if err != nil { log.Fatal(err) }
if len(built) == 0 {
    log.Fatal("the build produced nothing the library can see")
}`}},
    { label:"Repoint every node, start, report",
      note:"Give each node the build for its role. Setting firmware restarts the node. Then start the mesh and wait for the firmware to come up.",
      docs:[D("scripting.html","Roles"), D("scripting.html","Bringing a run up")],
      code:{
python:`for node in wb.nodes:
    role = (Role.COMPANION_RADIO if node.info.kind == Kind.COMPANION
            else Role.SIMPLE_REPEATER)
    node.firmware = builds[role]

wb.sim.start()
wb.firmware.wait_started(timedelta(minutes=10))
print(f"{len(wb.nodes)} nodes on a build from {checkout}")`,
go:`nodes, _ = wb.Nodes().List(ctx)
for _, n := range nodes {
    role := meshbench.RoleSimpleRepeater
    if n.Kind == meshbench.Companion { role = meshbench.RoleCompanionRadio }
    for _, b := range built {
        if b.Role == role { if err := wb.Node(n.Name).SetFirmware(ctx, b, true); err != nil { log.Fatal(err) } }
    }
}
if err := wb.Sim().Start(ctx); err != nil { log.Fatal(err) }
if err := wb.Firmware().WaitStarted(ctx, 10*time.Minute); err != nil { log.Fatal(err) }`}}
  ]
},
{
  id:"small-mesh", n:3, title:"A small mesh with traffic",
  tag:"Example 3 · needs a display · has Node",
  purpose:"Two repeaters and two companions, one of them a T-Deck, with a message to the public channel every twenty seconds and a node window open to watch it arrive.",
  needs:["a display"],
  phases:[
    { label:"Launch, place four nodes at once",
      note:"A new project, then place_many puts the whole mesh down in one call. One warm at the end rather than one per node.",
      docs:[D("scripting.html","Opening a session"), D("getting-started.html","Placing nodes")],
      code:{
python:`with Workbench.launch() as wb:
    wb.project.new(place="Fife")
    wb.nodes.place_many(MESH)   # R1, R2, C1, C2
    wb.wait_idle(timedelta(minutes=10))`,
go:`wb, err := meshbench.Launch(ctx)
if err != nil { log.Fatal(err) }
defer func() { _ = wb.Close() }()

if err := wb.Project().New(ctx, "Fife"); err != nil { log.Fatal(err) }
_, err = wb.Nodes().PlaceMany(ctx, mesh) // R1, R2, C1, C2
if err != nil { log.Fatal(err) }
if err := wb.WaitIdle(ctx, 10*time.Minute); err != nil { log.Fatal(err) }`,
node:`const wb = await Workbench.attach();
await wb.hello();

await wb.call("project.new", { place: "Fife" });
for (const node of MESH) await wb.call("nodes.place", node);`}},
    { label:"Make one a T-Deck, pin firmware",
      note:"The board goes on before the firmware is pinned, because a host image is not a board image and setting the board clears a pin made for different hardware. use_what_is_here pins each role to the newest build on this machine.",
      docs:[D("firmware-library.html","Firmware library"), D("scripting.html","Roles")],
      code:{
python:`wb.nodes["C1"].board = Board.LILYGO_TDECK
wb.firmware.use_what_is_here()`,
go:`if err := wb.Node("C1").SetBoard(ctx, meshbench.BoardLilyGoTDeck); err != nil { log.Fatal(err) }
_, err = wb.Firmware().UseWhatIsHere(ctx)
if err != nil { log.Fatal(err) }`,
node:`await wb.call("node.set_board", { node: "C1", board: "LilyGo_TDeck" });
// resolve the newest on-disk build for each needed role:
const { builds = [] } = await wb.call("firmware.library");
const onDisk = builds.filter((b) => b.on_disk && !b.board);
const { roles = [] } = await wb.call("firmware.needed");
for (const row of roles) {
  const build = onDisk.find((b) => b.role === row.role);
  await wb.call("firmware.set", { role: row.role, version: build.version });
}`}},
    { label:"Schedule repeating traffic",
      note:"Every twenty seconds, from the plain companion to the public channel. The times are simulated seconds — the mesh's own clock, not yours.",
      docs:[D("scripting.html","Two clocks"), D("reference-control.html","schedule.add")],
      code:{
python:`wb.schedule.add(
    "C2",
    "public hello",
    at=timedelta(seconds=5),
    every=timedelta(seconds=20),
)`,
go:`if err := wb.Schedule().Add(ctx, meshbench.Send{
    Node: "C2", Command: "public hello",
    At: 5 * time.Second, Every: 20 * time.Second,
}); err != nil { log.Fatal(err) }`,
node:`await wb.call("schedule.add", {
  node: "C2", command: "public hello",
  at_ms: 5_000, every_ms: 20_000,
});`}},
    { label:"Start, run the clock, read the traffic",
      note:"Bring the firmware up, run ten minutes of simulated time, then count the receptions in the tail of the event log.",
      docs:[D("scripting.html","Bringing a run up"), D("debugging.html","The event log")],
      code:{
python:`wb.sim.start()
wb.firmware.wait_started(timedelta(minutes=10))
wb.sim.run(timedelta(minutes=10), wait=timedelta(minutes=60))

received = [e for e in wb.events.recent(1000) if e.class_ == Class.RECEIVED]
print(f"{wb.events.total()} events, {len(received)} receptions in the tail")`,
go:`if err := wb.Sim().Start(ctx); err != nil { log.Fatal(err) }
if err := wb.Firmware().WaitStarted(ctx, 10*time.Minute); err != nil { log.Fatal(err) }
if err := wb.Sim().Run(ctx, 10*time.Minute, time.Hour); err != nil { log.Fatal(err) }

events, _ := wb.Events().Recent(ctx, 1000)
received := 0
for _, e := range events {
    if e.Class == meshbench.ClassReceived { received++ }
}
total, _ := wb.Events().Total(ctx)
fmt.Printf("%d events, %d receptions in the tail\\n", total, received)`,
node:`await wb.call("sim.play");
await wb.call("sim.run", { for_ms: 10 * 60_000 });

const { total = 0, events = [] } = await wb.call("events.recent", { limit: 1000 });
const received = events.filter((e) => e.class === "received");
console.log(\`\${total} events, \${received.length} receptions in the tail\`);`}}
  ]
},
{
  id:"headless", n:4, title:"The regression CI runs",
  tag:"Example 4 · no display",
  purpose:"Open a fixture, run it, check its assertions, write JUnit, and exit non-zero if the mesh stopped delivering. No display, no GPU, no toolkit — the shape a MeshCore pull request would use.",
  needs:["nothing but the binary"],
  phases:[
    { label:"Open headless, at a fixed seed",
      note:"headless starts a session with no window. A fixture and a seed make the run reproducible — same seed, same scenario, same result.",
      docs:[D("testing.html","Headless"), D("fixtures.html","Shipped networks")],
      code:{
python:`fixture = sys.argv[1] if len(sys.argv) > 1 else "fife-strict"
junit = sys.argv[2] if len(sys.argv) > 2 else ""

with Workbench.headless(fixture=fixture, seed=SEED) as wb:`,
go:`fixture := "fife-strict"
if len(os.Args) > 1 { fixture = os.Args[1] }
junit := ""
if len(os.Args) > 2 { junit = os.Args[2] }

wb, err := meshbench.Headless(ctx,
    meshbench.Fixture(fixture), meshbench.Seed(seed))
if err != nil { log.Fatal(err) }
defer func() { _ = wb.Close() }()`}},
    { label:"Bring the mesh up before running the clock",
      note:"sim.run only advances time; without starting the firmware first, nothing transmits and the run reports every assertion failed on a tree with nothing wrong with it — the worst thing a regression check can do.",
      docs:[D("scripting.html","Bringing a run up"), D("scripting.html","sim.start is the play button")],
      code:{
python:`wb.sim.start()
wb.firmware.wait_started()

wb.sim.run(timedelta(minutes=5), wait=timedelta(minutes=60))`,
go:`if err := wb.Sim().Start(ctx); err != nil { log.Fatal(err) }
if err := wb.Firmware().WaitStarted(ctx, 0); err != nil { log.Fatal(err) }

if err := wb.Sim().Run(ctx, 5*time.Minute, time.Hour); err != nil { log.Fatal(err) }`}},
    { label:"Check assertions, write JUnit",
      note:"The report prints the caveats above the numbers itself — this is the output somebody pastes into a pull request, and the caveats are the half that gets dropped.",
      docs:[D("testing.html","Assertions"), D("quality-gates.html","What the build enforces")],
      code:{
python:`report = wb.assertions.check()
print(report)
print(f"{wb.events.total()} events")

if junit:
    report.write_junit(junit)`,
go:`report, err := wb.Assertions().Check(ctx)
if err != nil { log.Fatal(err) }
fmt.Println(report)
if total, err := wb.Events().Total(ctx); err == nil {
    fmt.Printf("%d events\\n", total)
}
if junit != "" {
    if err := report.WriteJUnit(junit, ""); err != nil { log.Fatal(err) }
}`}},
    { label:"Exit code: 0 pass, 1 fail, 2 nothing checked",
      note:"A fixture with no assertions can report but cannot pass or fail — and a green tick that checked nothing is the worst outcome available here, so it is its own exit code.",
      docs:[D("testing.html","Exit codes"), D("quality-gates.html","Gating on it")],
      code:{
python:`if report.total == 0:
    return 2          # not a pass: nothing was checked
return 0 if report.ok else 1`,
go:`if report.Total == 0 {
    return 2 // not a pass: nothing was checked
}
if report.OK() { return 0 }
return 1`}}
  ]
},
{

const LANGS = [["python","Python"],["go","Go"],["node","Node"]];
const KW = {
  python:/\b(with|as|for|in|if|else|elif|try|except|return|def|import|from|not|and|or|is|None|True|False|print|class|while|lambda)\b/,
  go:/\b(func|for|if|else|range|return|var|const|struct|package|import|defer|go|map|chan|type|nil|true|false|break|continue|switch|case)\b/,
  node:/\b(const|let|var|for|of|in|if|else|return|async|await|function|new|import|from|export|null|undefined|true|false|throw|try|catch)\b/
};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function highlight(code, lang){
  const kw = KW[lang] || KW.python;
  const comStart = lang==="python" ? "#" : "//";
  return esc(code).split("\n").map(line=>{
    const ci = line.indexOf(esc(comStart));
    let head=line, tail="";
    if(ci>=0 && !/["'`]/.test(line.slice(0,ci))){ head=line.slice(0,ci); tail='<span class="cb-com">'+line.slice(ci)+'</span>'; }
    head = head
      .replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|`[^`]*?`)/g,'<span class="cb-str">$1</span>')
      .replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="cb-numt">$1</span>')
      .replace(kw, m=>'<span class="cb-kw">'+m+'</span>')
      .replace(/([A-Za-z_][A-Za-z0-9_]*)(\()/g,'<span class="cb-fnt">$1</span>$2');
    return head+tail;
  }).join("\n");
}

const state = {ex: EXAMPLES[0].id, lang: "python", open: {0:true}};
const listEl = document.getElementById("cb-list");
const mainEl = document.getElementById("cb-main");
function hasNode(ex){return ex.phases.some(p=>p.code.node)}
function lname(l){return {python:"Python",go:"Go",node:"Node"}[l]}

EXAMPLES.forEach(ex=>{
  const b=document.createElement("button");
  b.className="cb-link"; b.dataset.id=ex.id;
  b.innerHTML='<span class="cb-n">'+ex.n+'</span><span>'+ex.title+'</span>';
  b.onclick=()=>{ if(state.ex===ex.id) return;
    state.ex=ex.id; state.open={0:true};
    if(state.lang==="node" && !hasNode(ex)) state.lang="python"; render(); };
  listEl.appendChild(b);
});

function codeHTML(p, lang){
  const code = p.code[lang];
  return code ? '<pre><code>'+highlight(code, lang)+'</code></pre>'
    : '<div class="cb-na">No '+lname(lang)+' example for this step yet — Python and Go show it. The Node client is being filled in for the other examples.</div>';
}

// Swap the code in place: the open steps and the scroll position stay put.
function setLang(lang){
  const ex = EXAMPLES.find(e=>e.id===state.ex);
  state.lang = lang;
  mainEl.querySelectorAll(".cb-seg button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  mainEl.querySelectorAll(".cb-phase").forEach(ph=>{
    ph.querySelector(".cb-code").innerHTML = codeHTML(ex.phases[+ph.dataset.i], lang);
  });
}
function applyOpen(){
  mainEl.querySelectorAll(".cb-phase").forEach(ph=>{
    const o = !!state.open[+ph.dataset.i];
    ph.classList.toggle("closed", !o); ph.classList.toggle("lit", o);
  });
}

function render(){
  const ex = EXAMPLES.find(e=>e.id===state.ex);
  [...listEl.children].forEach(c=>c.classList.toggle("on", c.dataset.id===ex.id));
  const langBtns = LANGS.map(([id,label])=>{
    const avail = id!=="node" || hasNode(ex);
    return '<button data-lang="'+id+'"'+(state.lang===id?' class="on"':'')+(avail?'':' disabled')+'>'+label+'</button>';
  }).join("");
  const phases = ex.phases.map((p,i)=>{
    const opened = !!state.open[i];
    const docs = (p.docs||[]).map(d=>'<a href="'+d.href+'">'+d.text+'</a>').join("");
    return '<section class="cb-phase'+(opened?' lit':' closed')+'" data-i="'+i+'">'+
      '<div class="cb-phh"><span class="cb-num">'+(i+1)+'</span>'+
        '<span class="cb-pht"><b>'+p.label+'</b><span>'+p.note+'</span></span>'+
        '<span class="cb-chev">▾</span></div>'+
      '<div class="cb-pbody">'+(docs?'<div class="cb-docs">'+docs+'</div>':'')+
        '<div class="cb-code">'+codeHTML(p, state.lang)+'</div></div>'+
    '</section>';
  }).join("");
  mainEl.innerHTML =
    '<div class="cb-exhead"><div class="cb-tag">'+ex.tag+'</div><h3>'+ex.title+'</h3>'+
      '<p>'+ex.purpose+'</p><div class="cb-needs">'+ex.needs.map(n=>'<span class="cb-need">'+n+'</span>').join("")+'</div></div>'+
    '<div class="cb-bar"><div class="cb-seg">'+langBtns+'</div>'+
      '<span class="cb-hint">the same example — flip the language and it stays on your step, <b>line for line</b></span></div>'+
    phases;
  mainEl.querySelectorAll(".cb-seg button").forEach(b=>{ if(!b.disabled) b.onclick=()=>setLang(b.dataset.lang); });
  mainEl.querySelectorAll(".cb-phh").forEach(h=>{
    h.onclick=()=>{ const idx=+h.parentElement.dataset.i; state.open[idx]=!state.open[idx]; applyOpen(); };
  });
}
render();
})();
</script>
